services:
  minecraft:
    build:
      context: .
      args:
        # Fill these in yourself — see README.md for where to get them.
        MC_VERSION: "REPLACE_ME"
        MC_SERVER_URL: "REPLACE_ME"
    ports:
      - "25565:25565"
    environment:
      JAVA_MEM: "1024M"
    volumes:
      - mc-data:/data
    # Keeps stdin open and allocates a tty so `docker attach` can be used
    # to type console commands (e.g. "stop", "save-all") into the server.
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  mc-data:
